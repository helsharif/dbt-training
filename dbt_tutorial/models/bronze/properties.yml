version: 2

models:
  - name: bronze_date # name must match the filename of the SQL model
    description: "A description of the model using markdown."
    # In-file configurations using the 'config' key
    config:
      materialized: view
      schema: bronze

  - name: bronze_product # name must match the filename of the SQL model
    description: "A description of the model using markdown."
    # In-file configurations using the 'config' key
    config:
        materialized: view

  - name: bronze_sales # name must match the filename of the SQL model
    description: "A description of the model using markdown."
    # In-file configurations using the 'config' key
    config:
        materialized: view
    columns:
      - name: sales_id
        data_tests:
          - not_null
          - unique
      - name: store_sk
        data_tests:
          - not_null
      - name: gross_amount
        data_tests:
          - generic_non_negative
      
  - name: bronze_store # name must match the filename of the SQL model
    description: "A description of the model using markdown."
    # In-file configurations using the 'config' key
    config:
        materialized: view
    columns:
      - name: store_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
                config:
                  severity: warn
      - name: store_sk
        data_tests:
          - not_null
          - unique
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values: ['USA', 'Canada']
                config:
                  severity: warn


